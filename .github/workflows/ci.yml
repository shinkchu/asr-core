name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            args: --no-default-features
          - name: model-download
            args: --no-default-features --features model-download
          - name: openai-http
            args: --no-default-features --features backend-openai-http
          - name: dashscope
            args: --no-default-features --features backend-dashscope
          - name: openai-realtime
            args: --no-default-features --features backend-openai-realtime

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-${{ matrix.name }}

      - name: Test targets
        run: cargo test --locked ${{ matrix.args }} --all-targets

      - name: Test documentation
        run: cargo test --locked ${{ matrix.args }} --doc

  native-combos:
    name: Native feature combos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Resolve sherpa-onnx version
        id: sherpa
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep -A1 '^name = "sherpa-onnx-sys"' Cargo.lock | grep '^version' | cut -d '"' -f2)"
          if [ -z "$version" ]; then
            echo "Failed to resolve sherpa-onnx-sys version from Cargo.lock." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-combos

      # sherpa-onnx-sys skips its download when
      # target/sherpa-onnx-prebuilt/<archive>/lib exists. rust-cache prunes
      # the library files while keeping the directories, which would make
      # later builds skip the download and fail to link, so the prebuilt
      # libraries are cached separately: restored after rust-cache, and
      # saved by an explicit step so rust-cache's post-step cleanup can
      # never archive the pruned directory.
      - name: Restore sherpa-onnx prebuilt libraries
        uses: actions/cache/restore@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.sherpa.outputs.version }}

      - name: Test standalone native features
        shell: bash
        run: |
          set -euxo pipefail

          for features in \
            "capture-cpal" \
            "capture-cpal,backend-openai-http" \
            "backend-openai-http,vad-silero" \
            "backend-sherpa" \
            "backend-sherpa,vad-silero" \
            "backend-sherpa,punct-sherpa" \
            "backend-sherpa-shared,vad-silero,punct-sherpa"
          do
            cargo test \
              --locked \
              --no-default-features \
              --features "$features" \
              --all-targets

            cargo test \
              --locked \
              --no-default-features \
              --features "$features" \
              --doc
          done

      # Saved only after the whole job succeeds, so a run cancelled
      # mid-extraction cannot archive a partial library set under this
      # key (the exact key is never overwritten). Saving is skipped
      # harmlessly (continue-on-error) when the key already exists.
      - name: Save sherpa-onnx prebuilt libraries
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.sherpa.outputs.version }}

  native:
    name: Native (macOS ARM)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Resolve sherpa-onnx version
        id: sherpa
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep -A1 '^name = "sherpa-onnx-sys"' Cargo.lock | grep '^version' | cut -d '"' -f2)"
          if [ -z "$version" ]; then
            echo "Failed to resolve sherpa-onnx-sys version from Cargo.lock." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-macos-arm

      # See native-combos for why the sherpa-onnx prebuilt libraries are
      # cached separately from the target directory.
      - name: Restore sherpa-onnx prebuilt libraries
        uses: actions/cache/restore@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.sherpa.outputs.version }}

      - name: Test all features
        run: cargo test --locked --all-features --all-targets

      - name: Test all-feature documentation
        run: cargo test --locked --all-features --doc

      - name: Test relocated macOS shared executable outside Cargo
        shell: bash
        run: |
          set -euo pipefail

          # rpath must be attached to the final executable, not its dependencies.
          cargo rustc --locked --features backend-sherpa-shared,vad-silero \
            --example transcribe_file -- -C link-arg=-Wl,-rpath,@executable_path

          stage_dir="$(mktemp -d)"
          trap 'rm -rf "$stage_dir"' EXIT
          cp target/debug/examples/transcribe_file "$stage_dir/"
          cp -L target/debug/examples/*.dylib "$stage_dir/"
          (
            unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
            cd "$stage_dir"
            # No arguments: reaching the usage error proves main was entered.
            status=0
            ./transcribe_file > startup.log 2>&1 || status=$?
            cat startup.log
            test "$status" -eq 1
            grep -q 'usage: transcribe_file' startup.log
          )

      - name: Save sherpa-onnx prebuilt libraries
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.sherpa.outputs.version }}

  native-linux:
    name: Native (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Resolve sherpa-onnx version
        id: sherpa
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep -A1 '^name = "sherpa-onnx-sys"' Cargo.lock | grep '^version' | cut -d '"' -f2)"
          if [ -z "$version" ]; then
            echo "Failed to resolve sherpa-onnx-sys version from Cargo.lock." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux

      # See native-combos for why the sherpa-onnx prebuilt libraries are
      # cached separately from the target directory.
      - name: Restore sherpa-onnx prebuilt libraries
        uses: actions/cache/restore@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.sherpa.outputs.version }}

      - name: Test capture
        run: |
          cargo test \
            --locked \
            --no-default-features \
            --features capture-cpal \
            --all-targets

      - name: Test local native features
        run: |
          cargo test \
            --locked \
            --no-default-features \
            --features backend-sherpa,vad-silero,punct-sherpa \
            --all-targets

      - name: Test all features
        run: |
          cargo test \
            --locked \
            --all-features \
            --all-targets

      - name: Clippy all features
        run: |
          cargo clippy \
            --locked \
            --all-features \
            --all-targets \
            -- \
            -D warnings

      - name: Save sherpa-onnx prebuilt libraries
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.sherpa.outputs.version }}

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: package

      - name: Verify default feature set
        run: cargo test --locked --all-targets

      - name: Verify crate package
        run: cargo package --locked

      - name: Show packaged files
        run: cargo package --locked --list

  required:
    name: Required
    if: always()
    runs-on: ubuntu-latest

    needs:
      - format
      - features
      - native-combos
      - native
      - native-linux
      - package

    steps:
      - name: Verify required jobs
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          FEATURES_RESULT: ${{ needs.features.result }}
          NATIVE_COMBOS_RESULT: ${{ needs.native-combos.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          NATIVE_LINUX_RESULT: ${{ needs.native-linux.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          echo "format=$FORMAT_RESULT"
          echo "features=$FEATURES_RESULT"
          echo "native-combos=$NATIVE_COMBOS_RESULT"
          echo "native=$NATIVE_RESULT"
          echo "native-linux=$NATIVE_LINUX_RESULT"
          echo "package=$PACKAGE_RESULT"

          test "$FORMAT_RESULT" = "success"
          test "$FEATURES_RESULT" = "success"
          test "$NATIVE_COMBOS_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
          test "$NATIVE_LINUX_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
