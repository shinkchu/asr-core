name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )"
          TAG="${GITHUB_REF_NAME}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag does not match Cargo.toml version."
            echo "tag:      $TAG"
            echo "expected: v$VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Require tag commit to be on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "Release tag must point to a commit contained in master."
            exit 1
          }

      - name: Verify package
        run: cargo package --locked

  native:
    name: Release native verification
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-native-macos-intel

      - name: Clippy all features
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Test all features
        run: cargo test --locked --all-features --all-targets

      - name: Test documentation
        run: cargo test --locked --all-features --doc

  publish:
    name: Publish crates.io
    needs:
      - validate
      - native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Check whether version already exists
        id: crate
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          STATUS="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            -H 'User-Agent: asr-core-release-workflow' \
            "https://crates.io/api/v1/crates/asr-core/$VERSION")"

          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "asr-core $VERSION already exists on crates.io; skipping publish."
          elif [ "$STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io response: HTTP $STATUS"
            exit 1
          fi

      - name: Publish crate
        if: steps.crate.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  github-release:
    name: GitHub Release
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub Release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping creation."
          else
            gh release create "$TAG" \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi
