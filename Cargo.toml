[package]
name = "asr-core"
version = "0.0.1"
edition = "2021"
rust-version = "1.98"
description = "Unified streaming, offline, and cloud speech-to-text engine for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/appstore/asr-core"
homepage = "https://github.com/appstore/asr-core"
documentation = "https://docs.rs/asr-core"
keywords = ["speech-to-text", "asr", "speech-recognition", "audio", "transcription"]
categories = ["multimedia::audio", "api-bindings"]
publish = ["crates-io"]
exclude = [".github", "AGENTS.md", "docs/model-fixtures.json"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
capture-cpal = ["dep:cpal", "dep:ringbuf"]
backend-sherpa = ["dep:sherpa-onnx"]
# Shared linking permits externally supplied CUDA/CoreML native libraries.
backend-sherpa-shared = ["backend-sherpa", "sherpa-onnx/shared"]
vad-silero = ["dep:sherpa-onnx"]
punct-sherpa = ["backend-sherpa"]
model-download = ["dep:reqwest", "reqwest/blocking", "dep:sha2"]
backend-dashscope = [
    "dep:tokio", "tokio/rt-multi-thread", "tokio/net", "dep:futures",
    "dep:tokio-tungstenite", "dep:rustls", "dep:webpki-roots", "dep:url",
    "dep:serde_json", "dep:uuid",
]
backend-openai-http = [
    "dep:tokio", "tokio/rt-multi-thread", "tokio/net", "dep:futures",
    "dep:reqwest", "reqwest/multipart", "reqwest/stream", "dep:url", "dep:serde_json",
]
backend-openai-realtime = [
    "dep:tokio", "tokio/rt-multi-thread", "tokio/net", "dep:futures",
    "dep:tokio-tungstenite", "dep:rustls", "dep:webpki-roots", "dep:url",
    "dep:serde_json", "dep:base64",
]

[dependencies]
# audio capture
cpal = { version = "0.18", optional = true }
ringbuf = { version = "0.4", optional = true }

# local engines: streaming zipformer / offline (SenseVoice, Paraformer, FireRedASR2 等) / silero VAD
# sherpa-onnx-sys defaults to static on desktop when neither linking feature is
# enabled. Avoid forcing `static`, which would conflict with optional `shared`.
sherpa-onnx = { version = "1.13", optional = true, default-features = false }

# cloud realtime ASR websocket (DashScope Paraformer protocol)
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

# cloud HTTP client
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls", "system-proxy"] }
# verified model asset downloads (model-download)
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["sync", "rt", "macros", "time"] }
futures = { version = "0.3", optional = true, default-features = false, features = ["std"] }
uuid = { version = "1", optional = true, features = ["v4"] }
base64 = { version = "0.22", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
rubato = { version = "0.16.2", default-features = false }
url = { version = "2", optional = true }
hound = "3.5"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[example]]
name = "transcribe_file"
required-features = ["backend-sherpa"]

[[example]]
name = "streaming"
required-features = ["backend-sherpa"]

[[example]]
name = "microphone"
required-features = ["capture-cpal"]

[[example]]
name = "smoke_dashscope"
required-features = ["backend-dashscope"]

[[example]]
name = "smoke_realtime"
required-features = ["backend-openai-realtime"]

[[example]]
name = "smoke_http"
required-features = ["backend-openai-http"]
